<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crazy Number Fun!</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Crazy Number Fun!</h1>
        <p>Enter a number below and watch the magic happen! ud83eudd29ud83cudf1f</p>
        
        <div class="input-form">
            <input type="number" id="numberInput" placeholder="Type a fun number!">
            <button id="addNumberBtn">Add Magic Number!</button>
        </div>
        
        <div class="database-display">
            <h2>Your Amazing Numbers ud83dudcaf</h2>
            <ul id="numbersList"></ul>
            <div class="stats-display">
                <p>Total number of numbers: <span id="totalEntries">0</span> ud83dudcca</p>
                <p>Sum of all numbers: <span id="sumEntries">0</span> ud83euddc0</p>
                <p>Average number: <span id="avgEntries">0</span> ud83eudd13</p>
            </div>
        </div>
        
        <div class="controls">
            <button id="clearDatabaseBtn">Clear Everything!</button>
            <button id="changeColorBtn">Make It Colorful!</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
